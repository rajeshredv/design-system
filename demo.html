<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Button &amp; Toggle — design system gallery</title>
    <link rel="stylesheet" href="./tokens.css" />
    <!-- Button.vue has no styles of its own: button.css is the single source -->
    <link rel="stylesheet" href="./button.css" />
    <link rel="stylesheet" href="./toggle.css" />
    <link rel="stylesheet" href="./icon.css" />
    <style>
      body {
        font-family: var(--font-family-base);
        background: var(--color-bg-1);
        color: var(--color-text-primary);
        padding: 32px;
      }
      h1 {
        font-size: 20px;
        margin-bottom: 4px;
      }
      p.subtitle {
        color: var(--color-text-t3);
        margin-top: 0;
        margin-bottom: 32px;
      }
      table {
        border-collapse: collapse;
        margin-bottom: 40px;
      }
      caption {
        text-align: left;
        font-family: var(--font-family-medium);
        margin-bottom: 8px;
      }
      th,
      td {
        padding: 12px 16px;
        text-align: left;
        vertical-align: middle;
      }
      .topbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }
      th {
        color: var(--color-text-t3);
        font-size: 13px;
        font-family: var(--font-family-medium);
        border-bottom: 1px solid var(--color-bg-2);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script type="importmap">
      {
        "imports": {
          "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
        }
      }
    </script>
    <script type="module">
      import { createApp, h, ref } from "vue";
      import { loadModule } from "https://unpkg.com/vue3-sfc-loader@0.9/dist/vue3-sfc-loader.esm.js";

      const options = {
        moduleCache: { vue: await import("vue") },
        async getFile(url) {
          const res = await fetch(url);
          if (!res.ok) throw Object.assign(new Error(url + " " + res.statusText), { res });
          return { getContentData: (asBinary) => (asBinary ? res.arrayBuffer() : res.text()) };
        },
        addStyle(textContent) {
          const style = Object.assign(document.createElement("style"), { textContent });
          document.head.appendChild(style);
        },
      };

      const Button = await loadModule("./components/Button.vue", options);
      const Toggle = await loadModule("./components/Toggle.vue", options);

      // Follows the OS until the switch is flipped; see tokens.css for how data-theme works.
      const root = document.documentElement;
      const dark = ref(window.matchMedia("(prefers-color-scheme: dark)").matches);
      const setDark = (value) => {
        dark.value = value;
        root.dataset.theme = value ? "dark" : "light";
      };

      const TOGGLE_STATES = [
        { label: "Off", props: { modelValue: false } },
        { label: "On", props: { modelValue: true } },
        { label: "Off disabled", props: { modelValue: false, disabled: true } },
        { label: "On disabled", props: { modelValue: true, disabled: true } },
      ];
      const toggles = TOGGLE_STATES.map((s) => ref(s.props.modelValue));

      const VARIANTS = ["primary", "secondary", "ghost", "negative", "negative-secondary"];
      const STATES = [
        { label: "Default", props: {} },
        { label: "Loading", props: { loading: true } },
        { label: "Pressed", props: { pressed: true } },
        { label: "Disabled", props: { disabled: true } },
      ];
      const LABEL = { primary: "Reply", secondary: "Edit", ghost: "Edit", negative: "Delete", "negative-secondary": "Delete" };

      const App = {
        render() {
          return h("div", [
            h("div", { class: "topbar" }, [
              h("div", [
                h("h1", "Button & Toggle — design system"),
                h("p", { class: "subtitle" }, "Every variant × size × state, driven by tokens.css"),
              ]),
              h(Toggle, { modelValue: dark.value, "onUpdate:modelValue": setDark }, () => "Dark mode"),
            ]),

            h("table", [
              h("caption", "Toggle"),
              h("thead", h("tr", TOGGLE_STATES.map((s) => h("th", s.label)))),
              h(
                "tbody",
                h(
                  "tr",
                  TOGGLE_STATES.map((s, i) =>
                    h(
                      "td",
                      h(Toggle, {
                        modelValue: toggles[i].value,
                        "onUpdate:modelValue": (v) => (toggles[i].value = v),
                        disabled: s.props.disabled,
                        label: s.label,
                      })
                    )
                  )
                )
              ),
            ]),

            ...["small", "medium", "large"].map((size) =>
              h("table", { key: size }, [
                h("caption", `Size: ${size}`),
                h("thead", h("tr", [h("th", "Variant"), ...STATES.map((s) => h("th", s.label))])),
                h(
                  "tbody",
                  VARIANTS.map((variant) =>
                    h("tr", { key: variant }, [
                      h("td", variant),
                      ...STATES.map((s) =>
                        h("td", h(Button, { variant, size, ...s.props }, () => LABEL[variant]))
                      ),
                    ])
                  )
                ),
              ])
            ),

            h("table", [
              h("caption", "Link"),
              h("thead", h("tr", [h("th", "Size"), ...STATES.map((s) => h("th", s.label))])),
              h(
                "tbody",
                [undefined, "medium"].map((size) =>
                  h("tr", { key: size || "default" }, [
                    h("td", size ? "medium (3313:2456)" : "default = small (2145:2680)"),
                    ...STATES.map((s) => h("td", h(Button, { variant: "link", size, ...s.props }, () => "View all"))),
                  ])
                )
              ),
            ]),

            h("table", [
              h("caption", "Ghost with icon (Buttons-Primary/Icon)"),
              h("thead", h("tr", STATES.map((s) => h("th", s.label)))),
              h(
                "tbody",
                h(
                  "tr",
                  STATES.map((s) =>
                    h(
                      "td",
                      h(Button, { variant: "ghost", ...s.props }, {
                        icon: () => h("span", { class: "icon", style: "--icon:url(assets/icons/forward.svg)" }),
                        default: () => "Forward",
                      })
                    )
                  )
                )
              ),
            ]),

            h("table", [
              h("caption", "Full width"),
              h("tbody", [
                h("tr", h("td", { style: "width: 320px" }, h(Button, { variant: "primary", size: "large", fullWidth: true }, () => "Sign Up with Arattai"))),
                h("tr", h("td", { style: "width: 320px" }, h(Button, { variant: "secondary", size: "large", fullWidth: true }, () => "Cancel"))),
              ]),
            ]),
          ]);
        },
      };

      createApp(App).mount("#app");
    </script>
  </body>
</html>
